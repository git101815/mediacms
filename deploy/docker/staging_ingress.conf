worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. The upstream is re-resolved while web replicas
    # are added/removed during a rolling update.
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 1s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream mediacms_web {
        zone mediacms_web 64k;
        server web:80 resolve;
    }

    server {
        listen 80;
        server_name _;

        # Match the existing MediaCMS reverse-proxy upload contract.
        client_max_body_size 5800M;
        client_body_timeout 3600s;
        send_timeout 3600s;

        location / {
            proxy_pass http://mediacms_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # Do not spool multi-GB MediaCMS uploads into the ingress container.
            proxy_request_buffering off;
            proxy_buffering off;

            # During the DNS convergence window, retry a dead old web peer on
            # another healthy web peer. Non-idempotent requests are not retried
            # after they have been sent because `non_idempotent` is not enabled.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
