[program:celery_beat]
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=0
numprocs=1
user=www-data
directory=/home/mediacms.io/mediacms
priority=300
startinorder=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
command=/home/mediacms.io/bin/celery -A cms beat --pidfile=/var/run/mediacms/beat.pid --loglevel=INFO
