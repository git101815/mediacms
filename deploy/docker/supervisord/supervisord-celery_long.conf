[program:celery_long]
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=0
numprocs=1
user=www-data
directory=/home/mediacms.io/mediacms
priority=500
startinorder=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=7500
command=/bin/sh -c 'exec /home/mediacms.io/bin/celery -A cms worker --hostname=long@%%h --loglevel="${CELERY_LOG_LEVEL:-INFO}" -Ofair --prefetch-multiplier=1 -c12 -Q long_tasks'
