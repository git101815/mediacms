[program:celery_short]
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=0
numprocs=1
user=www-data
directory=/home/mediacms.io/mediacms
priority=400
startinorder=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=600
command=/bin/sh -c 'exec /home/mediacms.io/bin/celery -A cms worker --hostname=short@%%h --loglevel="${CELERY_LOG_LEVEL:-INFO}" --soft-time-limit=300 -c8 -Q short_tasks'
