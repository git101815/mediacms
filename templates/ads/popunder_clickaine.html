<script>
(function () {
  if (!window.mcPopAdsRuntime) {
    return;
  }

  var runtime = window.mcPopAdsRuntime;

  function boot(provider) {
    if (provider !== "clickaine") {
      return;
    }
    if (window.__mcClickaineBooted) {
      return;
    }

    var providerData = runtime.providerData || {};
    var scriptUrl = String(providerData.script_url || "");
    if (!scriptUrl) {
      runtime.advanceProvider("clickaine");
      return;
    }

    window.__mcClickaineBooted = true;
    window.mcPopLastAttempt = {
      provider: "clickaine",
      offer: "clickaine",
      mode: "third_party",
      ts: Date.now()
    };

    var script = document.createElement("script");
    script.src = scriptUrl;
    script.async = true;
    script.dataset.mcProvider = "clickaine";
    script.onerror = function () {
      window.__mcClickaineBooted = false;
      runtime.advanceProvider("clickaine");
    };
    document.body.appendChild(script);
  }

  document.addEventListener("mcPopProviderChange", function (event) {
    boot(event && event.detail ? event.detail.provider : null);
  });

  Promise.resolve(runtime.ready).then(boot);
})();
</script>
