<script>
(function () {
  if (window.__mcPopRotationInit) {
    return;
  }
  window.__mcPopRotationInit = true;

  var config = {
    tracking: {
      enabled: true,
      beaconDomains: ["coreadness.com"]
    },

    partner: {
      offers: [
        {
          key: "cams",
          weight: 50,
          urlTemplate: "https://track.gpsecureads.com/556564ae-1588-4c3a-a795-4684cf4d1da0?var1=celebfakessodaigr&var2=tab&var3=CLICKID"
        },
        {
          key: "dating",
          weight: 50,
          urlTemplate: "https://www.instabang.com/tours/?t=best&id=celebfakesgpigr&cmp=tab&ad_id=CLICKID"
        }
      ],

      engine: {
        enableCoverOverlays: true,
        coverSelectors: ["iframe", "object", "embed", "video"],
        bindTo: "",
        ignoreTo: "a[href^='#'], .no-popunder, [data-no-popunder='1']"
      }
    }
  };

  window.mcPopAdsConfig = config;

  function chooseWeightedOffer(offers) {
    if (!Array.isArray(offers) || !offers.length) {
      return null;
    }

    var totalWeight = 0;
    for (var i = 0; i < offers.length; i += 1) {
      totalWeight += Math.max(0, Number(offers[i].weight || 0));
    }

    if (totalWeight <= 0) {
      return null;
    }

    var bucket = Math.random() * totalWeight;
    var cursor = 0;

    for (var j = 0; j < offers.length; j += 1) {
      cursor += Math.max(0, Number(offers[j].weight || 0));
      if (bucket < cursor) {
        return offers[j];
      }
    }

    return null;
  }

  function emitProviderChange(runtime) {
    try {
      document.dispatchEvent(new CustomEvent("mcPopProviderChange", {
        detail: {
          provider: runtime.chosenProvider,
          data: runtime.providerData
        }
      }));
    } catch (error) {
      // ignore
    }
  }

  window.mcPopAdsRuntime = {
    chosenProvider: null,
    providerData: null,
    providerQueue: [],
    providerIndex: -1,
    ready: null,
    chooseWeightedOffer: chooseWeightedOffer,
    advanceProvider: function (expectedProvider) {
      if (
        expectedProvider
        && this.chosenProvider
        && this.chosenProvider !== expectedProvider
      ) {
        return this.chosenProvider;
      }

      this.providerIndex += 1;
      var entry = this.providerQueue[this.providerIndex] || null;
      this.providerData = entry;
      this.chosenProvider = entry && entry.name ? entry.name : null;
      emitProviderChange(this);
      return this.chosenProvider;
    }
  };

  window.mcPopAdsRuntime.ready = fetch(
    "/api/v1/ads/popunder/",
    {
      method: "GET",
      credentials: "same-origin",
      cache: "no-store",
      headers: { "Accept": "application/json" }
    }
  ).then(function (response) {
    if (response.status === 204 || !response.ok) {
      return { providers: [] };
    }
    return response.json();
  }).then(function (payload) {
    var runtime = window.mcPopAdsRuntime;
    runtime.providerQueue = Array.isArray(payload.providers)
      ? payload.providers
      : [];
    runtime.providerIndex = -1;
    return runtime.advanceProvider();
  }).catch(function () {
    var runtime = window.mcPopAdsRuntime;
    runtime.providerQueue = [];
    runtime.providerIndex = -1;
    runtime.providerData = null;
    runtime.chosenProvider = null;
    return null;
  });
})();
</script>
