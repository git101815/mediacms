
<script>
(function () {
  if (window.__mcPopRotationInit) {
    return;
  }
  window.__mcPopRotationInit = true;

  window.mcPopAdsConfig = {
    tracking: {
      enabled: true,
      beaconDomains: ["coreadness.com"]
    },
    interaction: {
      bindTo: "",
      ignoreTo: "a[href^='#'], .no-popunder, [data-no-popunder='1']"
    }
  };

  function emitProviderChange(runtime) {
    try {
      document.dispatchEvent(new CustomEvent("mcPopProviderChange", {
        detail: {
          provider: runtime.chosenProvider,
          data: runtime.providerData
        }
      }));
    } catch (error) {}
  }

  function consumeCooldown(runtime) {
    if (runtime.cooldownConsumed) {
      return;
    }
    runtime.cooldownConsumed = true;

    var url = "/api/v1/ads/popunder/consume/";
    var sent = false;
    try {
      if (navigator.sendBeacon) {
        sent = navigator.sendBeacon(url, new Blob(["1"], { type: "text/plain" }));
      }
    } catch (error) {}

    if (!sent && window.fetch) {
      try {
        fetch(url, {
          method: "POST",
          credentials: "same-origin",
          cache: "no-store",
          keepalive: true,
          headers: { "Content-Type": "text/plain" },
          body: "1"
        }).catch(function () {});
      } catch (error) {}
    }
  }

  window.mcPopAdsRuntime = {
    chosenProvider: null,
    providerData: null,
    providerQueue: [],
    providerIndex: -1,
    ready: null,
    cooldownConsumed: false,
    consumeCooldown: function () {
      consumeCooldown(this);
    },
    advanceProvider: function (expectedProvider) {
      if (
        expectedProvider
        && this.chosenProvider
        && this.chosenProvider !== expectedProvider
      ) {
        return this.chosenProvider;
      }

      this.providerIndex += 1;
      var entry = this.providerQueue[this.providerIndex] || null;
      this.providerData = entry;
      this.chosenProvider = entry && entry.name ? entry.name : null;
      emitProviderChange(this);
      return this.chosenProvider;
    }
  };

  window.mcPopAdsRuntime.ready = fetch(
    "/api/v1/ads/popunder/",
    {
      method: "GET",
      credentials: "same-origin",
      cache: "no-store",
      headers: { "Accept": "application/json" }
    }
  ).then(function (response) {
    if (response.status === 204 || !response.ok) {
      return { providers: [] };
    }
    return response.json();
  }).then(function (payload) {
    var runtime = window.mcPopAdsRuntime;
    runtime.providerQueue = Array.isArray(payload.providers)
      ? payload.providers
      : [];
    runtime.providerIndex = -1;
    return runtime.advanceProvider();
  }).catch(function () {
    var runtime = window.mcPopAdsRuntime;
    runtime.providerQueue = [];
    runtime.providerIndex = -1;
    runtime.providerData = null;
    runtime.chosenProvider = null;
    emitProviderChange(runtime);
    return null;
  });
})();
</script>
